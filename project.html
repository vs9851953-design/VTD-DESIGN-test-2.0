<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Projeto — VTD Design">
  <title>Projeto — VTD Design</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/project.css">

  <style>
    .p-cover img,
    .p-gallery img {
      display: block;
      width: 100%;
      height: auto;
    }

    .p-gallery {
      display: grid;
      gap: 28px;
      margin: 70px 0 100px;
    }

    .p-gallery img {
      border-radius: 6px;
      opacity: 0;
      transform: translateY(35px);
      animation: projectImageIn .7s ease forwards;
    }

    .p-gallery img:nth-child(1) { animation-delay: .05s; }
    .p-gallery img:nth-child(2) { animation-delay: .15s; }
    .p-gallery img:nth-child(3) { animation-delay: .25s; }
    .p-gallery img:nth-child(4) { animation-delay: .35s; }
    .p-gallery img:nth-child(5) { animation-delay: .45s; }
    .p-gallery img:nth-child(6) { animation-delay: .55s; }
    .p-gallery img:nth-child(7) { animation-delay: .65s; }

    @keyframes projectImageIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .project-error {
      padding: 120px 0;
      text-align: center;
    }

    .project-error code {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 16px;
      border: 1px solid var(--white-10);
      border-radius: 5px;
      color: var(--orange);
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="wrap">
      <a href="index.html" class="nav-logo">
        <img src="assets/logo-icon.svg" alt="VTD Design" onerror="this.style.display='none'">
        <span>VTD DESIGN</span>
      </a>
      <a href="index.html#trabalhos" class="nav-back">← Todos os Trabalhos</a>
    </div>
  </nav>

  <main id="projectRoot">
    <div class="loading-state">Carregando projeto…</div>
  </main>

  <footer>
    <div class="wrap">
      <div class="footer-bottom">
        <span>© <span id="copyYear">2026</span> VTD DESIGN.</span>
      </div>
    </div>
  </footer>

  <script>
    class ProjectLoader {
      constructor() {
        this.projects = [];
        this.currentProject = null;
      }

      async loadProjects() {
        const response = await fetch('portfolio.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Não foi possível carregar portfolio.json');
        this.projects = await response.json();
      }

      getProjectId() {
        return new URLSearchParams(window.location.search).get('id');
      }

      getCurrentProject() {
        const id = this.getProjectId();
        return this.projects.find(project => project.id === id);
      }

      image(src, alt, eager = false) {
        const img = document.createElement('img');
        img.src = src;
        img.alt = alt;
        img.loading = eager ? 'eager' : 'lazy';
        img.onerror = () => {
          console.error('Imagem não encontrada:', src);
          img.remove();
        };
        return img;
      }

      renderProject(project) {
        const root = document.getElementById('projectRoot');

        document.title = project.titulo + ' — VTD Design';

        const header = document.createElement('section');
        header.className = 'p-hero';
        header.innerHTML = `
          <div class="wrap">
            <div class="p-meta">${project.categoria}</div>
            <h1>${project.titulo}</h1>
            <div class="p-info">
              <span>${project.cliente}</span>
              <span>${project.ano}</span>
            </div>
          </div>
        `;

        const wrap = document.createElement('div');
        wrap.className = 'wrap';

        if (project.cover) {
          const cover = document.createElement('div');
          cover.className = 'p-cover';
          cover.appendChild(this.image(project.cover, project.titulo, true));
          wrap.appendChild(cover);
        }

        const body = document.createElement('div');
        body.className = 'p-body';

        const description = document.createElement('div');
        description.innerHTML = `
          <label class="p-desc-title">Sobre o Projeto</label>
          <p class="p-desc-text">${project.descricao || ''}</p>
        `;
        body.appendChild(description);

        if (project.feedback) {
          const feedback = document.createElement('div');
          feedback.innerHTML = `
            <label class="p-desc-title">Feedback</label>
            <p class="p-feedback">“${project.feedback}”</p>
            <div class="p-feedback-author">
              <strong>${project.feedbackAutor || ''}</strong>
              ${project.feedbackCargo ? ' — ' + project.feedbackCargo : ''}
            </div>
          `;
          body.appendChild(feedback);
        } else if (project.feedbackAutor) {
          const context = document.createElement('div');
          context.innerHTML = `
            <label class="p-desc-title">Contexto</label>
            <p class="p-feedback">${project.feedbackAutor}</p>
            <div class="p-feedback-author">${project.feedbackCargo || ''}</div>
          `;
          body.appendChild(context);
        }

        wrap.appendChild(body);

        if (project.gallery && project.gallery.length) {
          const gallery = document.createElement('div');
          gallery.className = 'p-gallery';

          project.gallery.forEach((src, index) => {
            const img = this.image(src, `${project.titulo} — ${index + 1}`);
            gallery.appendChild(img);
          });

          wrap.appendChild(gallery);
        }

        const index = this.projects.findIndex(p => p.id === project.id);
        const previous = this.projects[(index - 1 + this.projects.length) % this.projects.length];
        const next = this.projects[(index + 1) % this.projects.length];

        const nav = document.createElement('div');
        nav.className = 'p-nav-projects';
        nav.innerHTML = `
          <a href="index.html#trabalhos" class="p-nav-link">← Todos os Trabalhos</a>
          <a href="project.html?id=${encodeURIComponent(next.id)}" class="p-nav-link p-nav-link-next">
            Próximo: ${next.titulo} →
          </a>
        `;
        wrap.appendChild(nav);

        root.replaceChildren(header, wrap);

        // Animação de entrada das imagens conforme entram na viewport.
        const images = root.querySelectorAll('.p-gallery img');
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.style.animationPlayState = 'running';
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });

        images.forEach(img => {
          img.style.animationPlayState = 'paused';
          observer.observe(img);
        });
      }

      showError(message) {
        document.getElementById('projectRoot').innerHTML = `
          <div class="wrap project-error">
            <h1>Projeto não encontrado</h1>
            <p>${message}</p>
            <code>${window.location.href}</code>
          </div>
        `;
      }

      async initialize() {
        try {
          await this.loadProjects();

          const project = this.getCurrentProject();

          if (!project) {
            this.showError('O ID da URL não existe no portfolio.json.');
            return;
          }

          this.currentProject = project;
          this.renderProject(project);
        } catch (error) {
          console.error(error);
          this.showError('Não foi possível carregar o portfolio.json.');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new ProjectLoader().initialize();
    });

    document.getElementById('copyYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
